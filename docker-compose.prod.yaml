      NATS_SERVERS: nats://nats-server:4222
    command: npm run start:migrate:prod

  # ===== IMAGES UPLOAD MS =====
  pv-images-microservice:
    image: pv-images-microservice
    # depends_on:
    #   - pv-products-db-postgres
    #   - nats-server
    #   - pv-branches-microservice
