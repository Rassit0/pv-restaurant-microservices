    # Reinicia automáticamente el contenedor en caso de error
    restart: always
    build:
      context: ./pv-images-ms
      dockerfile: dockerfile
    container_name: pv-images-microservice
    environment:
      PORT: 3009
    command: npm run start:prod
    ports:
      - 3009:3009

